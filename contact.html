<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA VITA | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head><body><!-- Header -->
<header>

    <div class="logo">
        <span class="coffee-icon">☕</span>

        <div>
            <h1>LA VITA</h1>
            <p>ITALIAN CAFÉ</p>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

</header>


<!-- Contact Section -->
<main class="contact-page">

    <section class="contact-content">

        <p class="welcome">WE'D LOVE TO HEAR FROM YOU</p>

        <h2>Contact Us</h2>

        <p>
            Have a question or want to know more about LA VITA?
            Send us a message!
        </p>

        <form action="#" method="post">

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name"
                placeholder="Enter your name" required>

            <label for="email">Your Email</label>
            <input type="email" id="email" name="email"
                placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                placeholder="Enter the subject" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message"
                rows="5" placeholder="Write your message here..."
                required></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

    </section>

</main>


<!-- Footer -->
<footer>
    <p>© 2026 LA VITA Italian Café. All rights reserved.</p>
</footer>

</body>
</html>
